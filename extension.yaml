id: jcode.ext.pgclient
name: Postgres Client
version: 0.2.1
type: dbmanager
publisher: jcode
authors: [jcode, blamspotdev]
supportedArches: [arm64]
description: A PostgreSQL studio — browse databases in the drawer, then manage tables, run queries, view ER diagrams, security, and back up / restore in a full editor-area studio.
api:
  minApiVersion: 1
  capabilities: [exec, config, workbench]
settings:
  - key: pg.host
    label: Host
    type: str
    default: localhost
    description: PostgreSQL server host (a local server in this runtime, or a remote/cloud host).
  - key: pg.port
    label: Port
    type: int
    default: 5432
    description: PostgreSQL server port.
  - key: pg.user
    label: Role (user)
    type: str
    default: postgres
    description: PostgreSQL login role.
  - key: pg.password
    label: Password
    type: str
    description: Role password. Stored locally on this device.
  - key: pg.database
    label: Initial database
    type: str
    default: postgres
    description: Database used to enumerate the server (the studio opens the one you tap).
  - key: pg.sslmode
    label: SSL mode
    type: enum
    default: prefer
    options: [disable, prefer, require]
    description: libpq sslmode — disable for a local server, require for cloud servers that mandate TLS.
  - key: pg.ssh.mode
    label: Connection method
    type: enum
    default: "off"
    options: ["off", tunnel, ssh]
    description: >-
      How to reach the server. "off" connects straight from this runtime. "tunnel" opens an SSH
      port-forward and connects through it, for a database only its own network can see. "ssh" runs
      psql on the far side of the SSH connection and brings its output back.
  - key: pg.ssh.host
    label: SSH host
    type: str
    description: The machine to connect to over SSH — a bastion, or the database host itself.
  - key: pg.ssh.port
    label: SSH port
    type: int
    default: 22
  - key: pg.ssh.user
    label: SSH user
    type: str
  - key: pg.ssh.auth
    label: SSH authentication
    type: enum
    default: key
    options: [key, password]
    description: A private key file, or a password. Cloud hosts are usually key-only.
  - key: pg.ssh.key
    label: SSH private key file
    type: str
    description: Path to the key inside the Linux runtime — e.g. /root/.ssh/id_ed25519.
  - key: pg.ssh.passphrase
    label: SSH key passphrase
    type: str
    description: Only if the key is encrypted. Stored locally on this device.
  - key: pg.ssh.password
    label: SSH password
    type: str
    description: Used when authentication is set to password. Stored locally on this device.
  - key: pg.ssh.localPort
    label: Tunnel local port
    type: int
    default: 15432
    description: The near end of the port-forward, which psql connects to when tunnelling.
requires:
  extensions: []
  sdks: [postgresql]

# --- header fields merged from extension.jehm ---
shortDescription: >-
  A PostgreSQL studio — run a native local server or connect to any host, browse databases, manage tables, run queries,
  view ER diagrams, security, and back up / restore.
minJCodeVersion: 1.0.0
targetJCodeVersion: 1.0.0
category: Databases
subcategory: PostgreSQL
images:
  icon: media/icon.png
  samples: []
  walkthrough: []
entry:
  manifest: extension.yaml
  libs: []
  # Drawn in JCode's own process rather than a WebView. A bare dex, not an APK: this plugin owns no
  # resources — every icon it draws is one of JCode's own.
  native:
    dex: lib/pgstudio.dex
    class: dev.blamspot.jcode.ext.pg.PgExtension
    abi: 7
