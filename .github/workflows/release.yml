# Build this extension into a `.jext` and publish it to Releases.
#
# Every merge to main packs the extension and leaves the package on the run as an artifact; bumping
# `version:` in extension.yaml is what turns that build into a published Release. The build itself
# lives in the marketplace repo so that every Dev Pack and App shares one copy of it rather than
# fifteen that drift apart.
#
# What lands on the release is a PLAIN, unsigned package: signing is the marketplace's job and its
# key never reaches CI. See the reusable workflow for why.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    uses: blamspotdev/j-code-marketplace/.github/workflows/release-jext.yml@main
    permissions:
      contents: write
